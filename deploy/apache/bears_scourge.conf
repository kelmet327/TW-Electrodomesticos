# Configuración de ejemplo para Apache httpd 2.4 + mod_wsgi.
# Docker usa /app y /opt/venv. En una instalación local, sustitúyelos por las
# rutas reales del proyecto y del entorno virtual.

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html

    WSGIDaemonProcess bears_scourge \
        python-home=/opt/venv \
        user=app group=app \
        threads=4 \
        display-name=%{GROUP}
    WSGIProcessGroup bears_scourge
    WSGIScriptAlias / /app/wsgi.py
    WSGIRestrictEmbedded On
    WSGIApplicationGroup %{GLOBAL}

    SetEnv PYTHONUNBUFFERED 1
    # Define SECRET_KEY, DATABASE_URL y TAX_RATE en el entorno del proceso Apache
    # (por ejemplo, en /etc/apache2/envvars o en el sistema de despliegue).

    Alias /static /app/app/static
    <Directory /app>
        Require all granted
    </Directory>
    <Directory /app/app/static>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bears-scourge-error.log
    CustomLog ${APACHE_LOG_DIR}/bears-scourge-access.log combined
</VirtualHost>
